services:
  - type: web
    name: nairee-school-erp
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /api/dashboard/stats
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: nairee-data
      mountPath: /app/backend/data
      sizeGB: 1

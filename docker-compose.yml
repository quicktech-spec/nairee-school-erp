version: '3.8'

services:
  nairee-erp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nairee_erp_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=nairee_production_secret_key_2026
    volumes:
      - nairee_db_data:/app/backend/data
      - nairee_uploads:/app/backend/uploads

volumes:
  nairee_db_data:
  nairee_uploads:
